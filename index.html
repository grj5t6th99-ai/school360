<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School360 Qatar</title>
<style>
:root{
  --maroon:#7A1F32; --maroon-d:#5C1524; --maroon-t:#F4E6E9;
  --ink:#1E2430; --ink-2:#4B5563; --ink-3:#8A93A2;
  --base:#F1F3F6; --panel:#FFFFFF; --line:#DFE3E9;
  --sand:#B8955A; --sand-t:#F6F0E4;
  --ok:#1F8A4C; --ok-t:#E3F3E9; --warn:#C77A0E; --warn-t:#FBEFD9; --bad:#B42323; --bad-t:#F9E1E1; --info:#1F5FA8; --info-t:#E3ECF7;
  --r:6px;
  font-family:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--base);color:var(--ink);font-size:14px;line-height:1.45}
[dir=rtl]{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:16px}h3{font-size:14px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* rail */
.rail{background:var(--maroon-d);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:8px}
.brand .mark{width:34px;height:34px;border-radius:8px;background:var(--sand);color:var(--maroon-d);font-weight:700;display:grid;place-items:center;font-size:15px}
.brand b{display:block;font-size:15px}.brand small{opacity:.7;font-size:11px}
.role-lbl{font-size:11px;opacity:.6;padding:6px 8px 2px}
.nav{background:none;border:0;color:#fff;text-align:start;padding:9px 10px;border-radius:var(--r);display:flex;gap:10px;align-items:center;opacity:.78}
.nav:hover{background:rgba(255,255,255,.08);opacity:1}
.nav.on{background:rgba(255,255,255,.14);opacity:1;font-weight:600}
.nav .ic{width:20px;text-align:center}
.rail .spacer{flex:1}
.lang{display:flex;background:rgba(0,0,0,.25);border-radius:var(--r);padding:3px}
.lang button{flex:1;border:0;background:none;color:#fff;padding:6px;border-radius:4px;opacity:.7}
.lang button.on{background:#fff;color:var(--maroon-d);opacity:1;font-weight:600}
/* main */
.main{padding:22px 28px 60px;max-width:1180px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top .sub{color:var(--ink-2);margin-top:3px}
.roles{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px}
.roles button{border:0;background:none;padding:7px 12px;border-radius:5px;color:var(--ink-2)}
.roles button.on{background:var(--maroon);color:#fff}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.panel h2{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.rail .spacer{display:none}}
/* status board */
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;position:relative}
.tile:hover{border-color:var(--maroon)}
.tile.wide{grid-column:span 2}
.tile .k{font-size:12px;color:var(--ink-2)}
.tile .v{font-size:26px;font-weight:600;margin-top:2px;letter-spacing:-.02em}
.tile .d{font-size:12px;margin-top:4px}
.tile .bar{height:5px;background:var(--base);border-radius:3px;margin-top:10px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--ok)}
.tile.alert{background:var(--ok-t);border-color:#bfe3cc}
.tile.alert.hot{background:var(--bad-t);border-color:#efb4b4}
@media(max-width:1100px){.board{grid-template-columns:repeat(3,1fr)}}
/* generic */
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;line-height:1.5}
.ok{background:var(--ok-t);color:var(--ok)}.warn{background:var(--warn-t);color:var(--warn)}.bad{background:var(--bad-t);color:var(--bad)}.info{background:var(--info-t);color:var(--info)}.neut{background:var(--base);color:var(--ink-2)}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:12px;color:var(--ink-2);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #EEF0F3;vertical-align:middle}
tr:last-child td{border-bottom:0}
.btn{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:var(--r);color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.p{background:var(--maroon);border-color:var(--maroon);color:#fff}
.btn.p:hover{background:var(--maroon-d)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus,.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--sand);outline-offset:1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-2)}.small{font-size:12px}
.list>div{padding:10px 0;border-bottom:1px solid #EEF0F3;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.list>div:last-child{border-bottom:0}
/* parent */
.kids{display:flex;gap:10px;margin-bottom:16px}
.kid{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;min-width:180px;text-align:start}
.kid.on{border-color:var(--maroon);box-shadow:inset 0 0 0 1px var(--maroon)}
.kid .av{width:36px;height:36px;border-radius:50%;background:var(--maroon-t);color:var(--maroon);display:grid;place-items:center;font-weight:600}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px}
.quick button span{font-size:20px}
.quick button.on{border-color:var(--maroon);background:var(--maroon-t)}
/* bus timeline */
.bus{position:relative;padding-inline-start:26px}
.bus:before{content:"";position:absolute;inset-inline-start:8px;top:8px;bottom:8px;width:2px;background:var(--line)}
.bus .st{position:relative;padding:8px 0}
.bus .st:before{content:"";position:absolute;inset-inline-start:-23px;top:14px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.bus .st.done:before{background:var(--ok);border-color:var(--ok)}
.bus .st.live:before{background:var(--maroon);border-color:var(--maroon);box-shadow:0 0 0 5px var(--maroon-t)}
.bus .st.live b{color:var(--maroon)}
.eta{background:var(--maroon);color:#fff;border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.eta .big{font-size:30px;font-weight:600;letter-spacing:-.02em}
.fee{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.fee div{background:var(--base);border-radius:8px;padding:10px 12px}
.fee b{display:block;font-size:20px}
.fee .due b{color:var(--bad)}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto;padding:4px 0;margin-bottom:10px}
.msg{max-width:78%;padding:8px 12px;border-radius:12px;background:var(--base)}
.msg.me{align-self:flex-end;background:var(--maroon);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:12px}
/* attendance toggle */
.att{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.att button{border:0;background:#fff;padding:5px 10px;color:var(--ink-3)}
.att button.p.on{background:var(--ok);color:#fff}.att button.a.on{background:var(--bad);color:#fff}.att button.l.on{background:var(--warn);color:#fff}
/* facilities */
.pipe{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.pipe span{padding:3px 8px;border-radius:99px;background:var(--base)}
.pipe span.on{background:var(--maroon);color:#fff}
.check label{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #EEF0F3}
.check label:last-child{border:0}
/* toast + modal */
.toasts{position:fixed;inset-inline-end:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:320px;font-size:13px}
.toast b{display:block}
.modal{position:fixed;inset:0;background:rgba(20,24,32,.55);display:none;place-items:center;z-index:60}
.modal.open{display:grid}
.modal .box{background:#fff;border-radius:12px;padding:20px 22px;width:min(520px,92vw)}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.lvls button{border:2px solid var(--line);background:#fff;border-radius:8px;padding:10px;text-align:start}
.lvls button.on{border-color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.banner{background:var(--bad);color:#fff;padding:10px 16px;border-radius:8px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.trend{display:flex;gap:6px;align-items:flex-end;height:80px}
.trend div{flex:1;background:var(--maroon-t);border-radius:3px 3px 0 0;position:relative}
.trend div i{position:absolute;bottom:0;left:0;right:0;background:var(--maroon);border-radius:3px 3px 0 0}
.trend div small{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .25s ease}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.search{border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;min-width:220px;background:#fff}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--ink-2)}
.modal .box.wide{width:min(760px,94vw);max-height:90vh;overflow:auto}
.guide{position:absolute;inset-inline-end:28px;top:8px;z-index:40}.main{position:relative}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.mini div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.mini b{display:block;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{background:#fff;border:1px solid var(--line);border-radius:6px;min-height:58px;padding:4px 6px;font-size:11px}
.cal div.h{background:none;border:0;min-height:0;color:var(--ink-2);text-align:center}
.cal div em{display:block;font-style:normal;margin-top:2px;padding:1px 4px;border-radius:3px;background:var(--maroon-t);color:var(--maroon);font-size:10px;line-height:1.3}
.cal div em.ev2{background:var(--info-t);color:var(--info)}
.cal div em.ev3{background:var(--warn-t);color:var(--warn)}
.link{color:var(--maroon);cursor:pointer;font-weight:600}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;margin-bottom:10px}
.thread{border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.thread.on{border-color:var(--maroon);background:var(--maroon-t)}
@media(max-width:1100px){.mini{grid-template-columns:1fr 1fr}}
</style>
</head>

</div>

const $=id=>document.getElementById(id);
function toast(a,b){const d=document.createElement("div");d.className="toast";d.innerHTML=`<b>${a}</b>${b||""}`;$("toasts").appendChild(d);setTimeout(()=>d.remove(),4500)}
function pushNotif(i,m){S.notifs.unshift({i,m,w:A("now","الآن")})}

function setRole(r){S.role=r;S.page=NAV[r][0][0];render()}
function go(p){S.page=p;render()}
function pill(s){return{ok:"ok",warn:"warn",bad:"bad",high:"bad",med:"warn",low:"neut",new:"info",assigned:"info",progress:"warn",done:"ok",verified:"ok",Present:"ok","On leave":"warn",Active:"ok",Invited:"warn","Not installed":"neut","On route":"info",Approaching:"warn","At school":"ok",Breakdown:"bad",Good:"ok",Fair:"warn",Poor:"bad",Pending:"warn",Submitted:"ok"}[s]||"neut"}
function head(a,b){$("pageTitle").textContent=a;$("pageSub").textContent=b||""}
function tbl(cols,rows){return `<table><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`}
function modalOpen(html,wide){$("modalBox").className="box"+(wide?" wide":"");$("modalBox").innerHTML=html+`<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="modalClose()">${t("close")}</button></div>`;$("modal").classList.add("open")}
function modalClose(){$("modal").classList.remove("open")}

function render(){
  $("roleTabs").innerHTML=["admin","parent","teacher","fm"].map(r=>`<button class="${S.role===r?"on":""}" onclick="setRole('${r}')">${t(r)}</button>`).join("");
